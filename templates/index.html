<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipto's Student Score Predictor</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container mt-5 content">
    <h1 class="text-center mb-4">🎓 Student Performance Predictor</h1>

    <form method="POST" action="/">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="gender">Gender</label>
          <select class="form-control" name="gender" required>
            <option disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="form-group col-md-6">
          <label for="race_ethnicity">Race/Ethnicity</label>
          <select class="form-control" name="race_ethnicity" required>
            <option disabled selected>Select group</option>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="parental_level_of_education">Parental Level of Education</label>
        <select class="form-control" name="parental_level_of_education" required>
          <option disabled selected>Select education</option>
          <option value="master's degree">Master's Degree</option>
          <option value="bachelor's degree">Bachelor's Degree</option>
          <option value="associate's degree">Associate's Degree</option>
          <option value="some college">Some College</option>
          <option value="some high school">Some High School</option>
          <option value="high school">High School</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="lunch">Lunch Type</label>
          <select class="form-control" name="lunch" required>
            <option disabled selected>Select lunch type</option>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free/Reduced</option>
          </select>
        </div>

        <div class="form-group col-md-6">
          <label for="test_preparation_course">Test Preparation</label>
          <select class="form-control" name="test_preparation_course" required>
            <option disabled selected>Preparation done?</option>
            <option value="completed">Yes</option>
            <option value="none">No</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="reading_score">Reading Score</label>
          <input type="number" class="form-control" name="reading_score" min="0" max="100" placeholder="0 - 100" required>
        </div>

        <div class="form-group col-md-6">
          <label for="writing_score">Writing Score</label>
          <input type="number" class="form-control" name="writing_score" min="0" max="100" placeholder="0 - 100" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Predict Math Score</button>
    </form>

    <div class="card mt-4 result-card" style="display: none;">
      <div class="card-body text-center">
        <h4 class="card-title">📊 Predicted Math Score</h4>
        <h2 class="text-success" id="predicted-score"></h2>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS, Popper.js, and jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWGaBxGEzfuPmKjISu" crossorigin="anonymous"></script>
</body>
</html>
